<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>BookLoop — Find a book. Pass it on.</title>
    <meta name="description" content="Student-to-student second-hand textbook marketplace for nearby colleges and schools." />
    <script>
    <script>
      // Automatically redirect away from invalid multi-level subdomain www.*.vercel.app if reached
      if (typeof window !== 'undefined' && window.location.hostname.startsWith('www.') && window.location.hostname.endsWith('.vercel.app')) {
        window.location.replace('https://' + window.location.hostname.replace(/^www\./, '') + window.location.pathname + window.location.search);
      }

      // Suppress any Netlify deploy preview or "Powered by Netlify" floating badges
      (function() {
        function removeNetlifyBadges() {
          const selectors = [
            '#netlify-feedback-badge',
            '[data-netlify-deploy-preview]',
            '.netlify-badge',
            'netlify-drawer',
            'netlify-drawer-root',
            'iframe[src*="netlify"]'
          ];
          selectors.forEach(function(sel) {
            document.querySelectorAll(sel).forEach(function(el) { el.remove(); });
          });
          document.querySelectorAll('div, a, button').forEach(function(el) {
            if (el.textContent && el.textContent.trim().toLowerCase() === 'powered by netlify') {
              el.remove();
            }
          });
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', removeNetlifyBadges);
        } else {
          removeNetlifyBadges();
        }
        var obs = new MutationObserver(removeNetlifyBadges);
        obs.observe(document.documentElement, { childList: true, subtree: true });
        setTimeout(function() { obs.disconnect(); }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
