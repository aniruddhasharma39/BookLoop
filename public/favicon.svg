      <stop offset="100%" stop-color="#243B64" />
    </linearGradient>
    <filter id="blShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.25" />
